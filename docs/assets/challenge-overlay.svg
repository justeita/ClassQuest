<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180" role="img" aria-labelledby="challenge-title challenge-desc" shape-rendering="crispEdges">
  <title id="challenge-title">Overlay tantangan di atas cerita</title>
  <desc id="challenge-desc">Mockup: dunia game diredupkan, lalu kartu soal muncul di tengah dengan tiga pilihan jawaban dan tombol Jawab.</desc>

  <!-- dunia game (versi redup) -->
  <rect width="320" height="180" fill="#F4EFE6"/>
  <rect x="0" y="112" width="320" height="68" fill="#E8A87C"/>
  <rect x="26" y="18" width="82" height="54" fill="#7FA6C9"/>
  <rect x="176" y="22" width="112" height="52" fill="#14201A"/>
  <rect x="24" y="72" width="24" height="48" fill="#14201A"/>
  <rect x="84" y="84" width="30" height="36" fill="#7FA6C9"/>
  <rect x="8" y="120" width="304" height="52" fill="#14201A"/>
  <rect width="320" height="180" fill="#1F1E28" opacity="0.62"/>

  <!-- kartu tantangan -->
  <rect x="36" y="18" width="248" height="146" fill="#F4EFE6"/>
  <rect x="36" y="18" width="248" height="146" fill="none" stroke="#14201A" stroke-width="2"/>
  <rect x="36" y="18" width="248" height="14" fill="#14201A"/>
  <text x="44" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">TANTANGAN · IPA · MUDAH</text>

  <text x="46" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#1F1E28">Apa yang terjadi pada air genangan</text>
  <text x="46" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#1F1E28">saat terkena panas matahari?</text>

  <!-- opsi -->
  <g>
    <rect x="46" y="74" width="228" height="16" fill="#E8A87C"/>
    <rect x="46" y="74" width="228" height="16" fill="none" stroke="#14201A" stroke-width="1"/>
    <rect x="52" y="79" width="6" height="6" fill="#14201A"/>
    <rect x="54" y="81" width="2" height="2" fill="#F4EFE6"/>
    <text x="64" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#1F1E28">Menguap menjadi uap air</text>

    <rect x="46" y="94" width="228" height="16" fill="#F7F4EC" stroke="#14201A" stroke-opacity="0.35"/>
    <rect x="52" y="99" width="6" height="6" fill="none" stroke="#14201A" stroke-opacity="0.5"/>
    <text x="64" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#1F1E28">Membeku menjadi es</text>

    <rect x="46" y="114" width="228" height="16" fill="#F7F4EC" stroke="#14201A" stroke-opacity="0.35"/>
    <rect x="52" y="119" width="6" height="6" fill="none" stroke="#14201A" stroke-opacity="0.5"/>
    <text x="64" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#1F1E28">Berubah menjadi tanah</text>
  </g>

  <!-- tombol -->
  <rect x="206" y="140" width="68" height="16" fill="#14201A"/>
  <text x="222" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">JAWAB</text>

  <text x="46" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" fill="#1F1E28" opacity="0.65">1-3 pilih · Enter jawab</text>
</svg>
