<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180" role="img" aria-labelledby="game-title game-desc" shape-rendering="crispEdges">
  <title id="game-title">Layar dialog game ClassQuest di desa</title>
  <desc id="game-desc">Mockup layar game 16:9: Desa Sukamaju dari atas — rumput, jalan tanah, dua rumah, pohon, kolam, dan sumur. Pemain Nara berdiri di dekat Pak Wira, dengan kotak dialog berisi nama dan dua baris teks.</desc>

  <!-- tanah desa -->
  <rect width="320" height="180" fill="#6F9B7A"/>
  <rect x="0" y="0" width="320" height="6" fill="#14201A" opacity="0.15"/>

  <!-- jalan tanah -->
  <rect x="0" y="86" width="320" height="22" fill="#E8A87C"/>
  <rect x="0" y="86" width="320" height="2" fill="#1F1E28" opacity="0.15"/>
  <rect x="132" y="0" width="22" height="180" fill="#E8A87C"/>
  <rect x="132" y="0" width="2" height="180" fill="#1F1E28" opacity="0.12"/>

  <!-- bercak rumput -->
  <rect x="22" y="30" width="10" height="3" fill="#14201A" opacity="0.12"/>
  <rect x="60" y="118" width="14" height="3" fill="#14201A" opacity="0.12"/>
  <rect x="250" y="40" width="12" height="3" fill="#14201A" opacity="0.12"/>
  <rect x="286" y="120" width="10" height="3" fill="#14201A" opacity="0.12"/>

  <!-- rumah merah -->
  <g>
    <rect x="150" y="18" width="58" height="34" fill="#F4EFE6"/>
    <rect x="146" y="6" width="66" height="16" fill="#E8A87C"/>
    <rect x="146" y="6" width="66" height="4" fill="#1F1E28" opacity="0.2"/>
    <rect x="146" y="6" width="66" height="16" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="150" y="18" width="58" height="34" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="172" y="32" width="14" height="20" fill="#1F1E28"/>
    <rect x="156" y="24" width="10" height="8" fill="#7FA6C9"/>
    <rect x="192" y="24" width="10" height="8" fill="#7FA6C9"/>
  </g>

  <!-- rumah biru -->
  <g>
    <rect x="24" y="24" width="46" height="30" fill="#F4EFE6"/>
    <rect x="20" y="14" width="54" height="14" fill="#7FA6C9"/>
    <rect x="20" y="14" width="54" height="4" fill="#1F1E28" opacity="0.2"/>
    <rect x="20" y="14" width="54" height="14" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="24" y="24" width="46" height="30" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="42" y="36" width="12" height="18" fill="#1F1E28"/>
    <rect x="30" y="30" width="8" height="8" fill="#7FA6C9"/>
  </g>

  <!-- pohon besar kiri -->
  <g>
    <rect x="98" y="30" width="5" height="12" fill="#1F1E28"/>
    <rect x="90" y="10" width="22" height="24" fill="#14201A"/>
    <rect x="90" y="10" width="22" height="6" fill="#6F9B7A"/>
    <rect x="94" y="14" width="4" height="4" fill="#6F9B7A" opacity="0.7"/>
  </g>

  <!-- pohon kecil kanan -->
  <g>
    <rect x="240" y="34" width="4" height="9" fill="#1F1E28"/>
    <rect x="234" y="22" width="16" height="16" fill="#14201A"/>
    <rect x="234" y="22" width="16" height="5" fill="#6F9B7A"/>
  </g>

  <!-- kolam -->
  <rect x="16" y="124" width="60" height="30" fill="#7FA6C9"/>
  <rect x="14" y="122" width="64" height="34" fill="none" stroke="#1F1E28" stroke-width="2"/>
  <rect x="26" y="132" width="16" height="3" fill="#F7F4EC" opacity="0.7"/>
  <rect x="50" y="142" width="14" height="3" fill="#F7F4EC" opacity="0.55"/>

  <!-- sumur batu -->
  <g>
    <rect x="248" y="128" width="26" height="18" fill="#F4EFE6"/>
    <rect x="246" y="124" width="30" height="6" fill="#E8A87C"/>
    <rect x="246" y="124" width="30" height="6" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="248" y="128" width="26" height="18" fill="none" stroke="#1F1E28" stroke-width="2"/>
    <rect x="258" y="134" width="6" height="6" fill="#7FA6C9"/>
  </g>

  <!-- bunga aksen -->
  <rect x="196" y="130" width="3" height="3" fill="#D98FA3"/>
  <rect x="206" y="140" width="3" height="3" fill="#C9A227"/>
  <rect x="120" y="136" width="3" height="3" fill="#D98FA3"/>

  <!-- karakter: Pak Wira (pemberi quest) -->
  <g>
    <rect x="166" y="70" width="20" height="5" fill="#1F1E28"/>
    <rect x="163" y="75" width="26" height="20" fill="#14201A"/>
    <rect x="163" y="75" width="26" height="4" fill="#E8A87C"/>
    <rect x="171" y="84" width="3" height="3" fill="#F4EFE6"/>
    <rect x="179" y="84" width="3" height="3" fill="#F4EFE6"/>
  </g>

  <!-- karakter: Nara (pemain) -->
  <g>
    <rect x="168" y="96" width="18" height="5" fill="#1F1E28"/>
    <rect x="165" y="101" width="24" height="16" fill="#7FA6C9"/>
    <rect x="165" y="113" width="9" height="10" fill="#1F1E28"/>
    <rect x="180" y="113" width="9" height="10" fill="#1F1E28"/>
    <rect x="172" y="107" width="3" height="3" fill="#1F1E28"/>
    <rect x="179" y="107" width="3" height="3" fill="#1F1E28"/>
  </g>

  <!-- textbox -->
  <rect x="8" y="120" width="304" height="52" fill="#14201A"/>
  <rect x="8" y="120" width="304" height="52" fill="none" stroke="#F7F4EC" stroke-width="2"/>
  <rect x="16" y="128" width="46" height="9" fill="#E8A87C"/>
  <text x="19" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#1F1E28">Pak Wira</text>

  <text x="16" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">Sebelum mulai, ayo pastikan</text>
  <text x="16" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">takarannya benar.</text>

  <!-- indikator lanjut -->
  <rect x="298" y="162" width="6" height="6" fill="#E8A87C"/>
  <rect x="300" y="159" width="2" height="2" fill="#E8A87C"/>
</svg>
