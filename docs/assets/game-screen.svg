<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180" role="img" aria-labelledby="game-title game-desc" shape-rendering="crispEdges">
  <title id="game-title">Layar dialog game ClassQuest</title>
  <desc id="game-desc">Mockup layar game 16:9: ruang kelas siang, dua karakter, dan kotak dialog berisi nama serta dua baris teks.</desc>

  <!-- ruang kelas -->
  <rect width="320" height="180" fill="#F4EFE6"/>
  <rect x="0" y="112" width="320" height="68" fill="#E8A87C"/>
  <rect x="0" y="110" width="320" height="2" fill="#1F1E28" opacity="0.25"/>

  <!-- jendela -->
  <rect x="26" y="18" width="82" height="54" fill="#7FA6C9"/>
  <rect x="24" y="16" width="86" height="58" fill="none" stroke="#1F1E28" stroke-width="2"/>
  <rect x="65" y="16" width="2" height="58" fill="#1F1E28" opacity="0.6"/>
  <rect x="24" y="44" width="86" height="2" fill="#1F1E28" opacity="0.6"/>
  <rect x="36" y="28" width="18" height="8" fill="#F7F4EC" opacity="0.85"/>
  <rect x="70" y="54" width="26" height="6" fill="#F7F4EC" opacity="0.7"/>

  <!-- papan tulis -->
  <rect x="176" y="22" width="112" height="52" fill="#14201A"/>
  <rect x="174" y="20" width="116" height="56" fill="none" stroke="#1F1E28" stroke-width="2"/>
  <rect x="188" y="36" width="48" height="3" fill="#F7F4EC" opacity="0.75"/>
  <rect x="188" y="46" width="72" height="3" fill="#F7F4EC" opacity="0.55"/>
  <rect x="188" y="56" width="36" height="3" fill="#F7F4EC" opacity="0.4"/>

  <!-- meja -->
  <rect x="120" y="96" width="74" height="8" fill="#1F1E28" opacity="0.35"/>
  <rect x="128" y="104" width="6" height="12" fill="#1F1E28" opacity="0.35"/>
  <rect x="180" y="104" width="6" height="12" fill="#1F1E28" opacity="0.35"/>

  <!-- karakter: Pak Bima (kiri) -->
  <g>
    <rect x="24" y="72" width="24" height="8" fill="#1F1E28"/>
    <rect x="20" y="80" width="32" height="24" fill="#14201A"/>
    <rect x="20" y="104" width="12" height="16" fill="#1F1E28"/>
    <rect x="40" y="104" width="12" height="16" fill="#1F1E28"/>
    <rect x="20" y="80" width="32" height="4" fill="#E8A87C"/>
    <rect x="30" y="88" width="3" height="3" fill="#F7F4EC"/>
    <rect x="39" y="88" width="3" height="3" fill="#F7F4EC"/>
  </g>

  <!-- karakter: Nara (kanan) -->
  <g>
    <rect x="88" y="76" width="22" height="8" fill="#1F1E28"/>
    <rect x="84" y="84" width="30" height="22" fill="#7FA6C9"/>
    <rect x="84" y="106" width="11" height="14" fill="#1F1E28"/>
    <rect x="103" y="106" width="11" height="14" fill="#1F1E28"/>
    <rect x="92" y="92" width="3" height="3" fill="#1F1E28"/>
    <rect x="101" y="92" width="3" height="3" fill="#1F1E28"/>
  </g>

  <!-- textbox -->
  <rect x="8" y="120" width="304" height="52" fill="#14201A"/>
  <rect x="8" y="120" width="304" height="52" fill="none" stroke="#F7F4EC" stroke-width="2"/>
  <rect x="16" y="128" width="42" height="9" fill="#E8A87C"/>
  <text x="19" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#1F1E28">Pak Bima</text>

  <text x="16" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">Genangan itu tadi pagi masih penuh.</text>
  <text x="16" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#F7F4EC">Ke mana airnya?</text>

  <!-- indikator lanjut -->
  <rect x="298" y="162" width="6" height="6" fill="#E8A87C"/>
  <rect x="300" y="159" width="2" height="2" fill="#E8A87C"/>
</svg>
