<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="palette-title palette-desc">
  <title id="palette-title">Palet ClassQuest</title>
  <desc id="palette-desc">Sembilan warna resmi: enam warna inti, dua warna fungsional untuk umpan balik, dan satu aksen karakter.</desc>

  <rect width="720" height="292" fill="#F4EFE6"/>

  <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1F1E28">Palet ClassQuest</text>
  <text x="24" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28" opacity="0.7">Enam warna inti + dua fungsional + satu aksen karakter. Tidak ada warna lain.</text>

  <!-- baris 1 -->
  <g>
    <rect x="24" y="72" width="128" height="64" fill="#F4EFE6" stroke="#1F1E28" stroke-opacity="0.2"/>
    <text x="32" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">latar terang</text>
    <text x="32" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#F4EFE6</text>

    <rect x="160" y="72" width="128" height="64" fill="#14201A"/>
    <text x="168" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">latar gelap</text>
    <text x="168" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#14201A</text>

    <rect x="296" y="72" width="128" height="64" fill="#E8A87C"/>
    <text x="304" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">aksen utama</text>
    <text x="304" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#E8A87C</text>

    <rect x="432" y="72" width="128" height="64" fill="#7FA6C9"/>
    <text x="440" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">aksen dingin</text>
    <text x="440" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#7FA6C9</text>

    <rect x="568" y="72" width="128" height="64" fill="#D98FA3"/>
    <text x="576" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">aksen karakter</text>
    <text x="576" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#D98FA3</text>
  </g>

  <!-- baris 2 -->
  <g>
    <rect x="24" y="180" width="128" height="64" fill="#1F1E28"/>
    <text x="32" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#F7F4EC">teks</text>
    <text x="32" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7F4EC" opacity="0.7">#1F1E28</text>

    <rect x="160" y="180" width="128" height="64" fill="#F7F4EC" stroke="#1F1E28" stroke-opacity="0.2"/>
    <text x="168" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">teks terang</text>
    <text x="168" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">#F7F4EC</text>

    <rect x="296" y="180" width="128" height="64" fill="#6F9B7A"/>
    <text x="304" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#F7F4EC">benar / sukses</text>
    <text x="304" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7F4EC" opacity="0.8">#6F9B7A</text>

    <rect x="432" y="180" width="128" height="64" fill="#C9A227"/>
    <text x="440" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1F1E28">peringatan</text>
    <text x="440" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.7">#C9A227</text>
  </g>
</svg>
