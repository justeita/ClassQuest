<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="dash-title dash-desc">
  <title id="dash-title">Mockup dashboard guru</title>
  <desc id="dash-desc">Daftar materi berisi dua kartu cerita dengan status, jumlah bab, dan tombol edit serta preview.</desc>

  <rect width="720" height="440" fill="#F7F4EC"/>

  <!-- header -->
  <rect x="0" y="0" width="720" height="56" fill="#F4EFE6"/>
  <rect x="0" y="56" width="720" height="1" fill="#1F1E28" opacity="0.12"/>
  <rect x="24" y="20" width="10" height="16" fill="#E8A87C"/>
  <rect x="38" y="20" width="10" height="16" fill="#14201A"/>
  <text x="56" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#1F1E28">ClassQuest</text>
  <text x="56" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28" opacity="0.6">Ruang guru</text>

  <rect x="548" y="16" width="148" height="26" fill="#14201A"/>
  <text x="566" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#F7F4EC">+ Buat cerita baru</text>

  <!-- judul halaman -->
  <text x="24" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1F1E28">Materi saya</text>
  <text x="24" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.6">2 materi · 1 perlu direview</text>

  <!-- kartu 1 -->
  <rect x="24" y="132" width="672" height="116" fill="#FFFFFF" stroke="#1F1E28" stroke-opacity="0.1"/>
  <rect x="24" y="132" width="4" height="116" fill="#C9A227"/>

  <text x="44" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1F1E28">Ke Mana Perginya Genangan Itu?</text>
  <text x="44" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.65">IPA · SMP 7 · 3 bab · 6 soal · diubah 2 menit lalu</text>

  <rect x="44" y="192" width="96" height="20" fill="#C9A227" opacity="0.18"/>
  <text x="54" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Perlu direview</text>

  <rect x="470" y="192" width="66" height="24" fill="#F4EFE6" stroke="#1F1E28" stroke-opacity="0.2"/>
  <text x="488" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Preview</text>
  <rect x="546" y="192" width="66" height="24" fill="#E8A87C"/>
  <text x="568" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Edit</text>
  <rect x="622" y="192" width="54" height="24" fill="#14201A"/>
  <text x="634" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#F7F4EC">Bagikan</text>

  <!-- kartu 2 -->
  <rect x="24" y="264" width="672" height="116" fill="#FFFFFF" stroke="#1F1E28" stroke-opacity="0.1"/>
  <rect x="24" y="264" width="4" height="116" fill="#6F9B7A"/>

  <text x="44" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1F1E28">Fotosintesis di Taman Sekolah</text>
  <text x="44" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#1F1E28" opacity="0.65">IPA · SMP 7 · 4 bab · 8 soal · diubah kemarin</text>

  <rect x="44" y="324" width="104" height="20" fill="#6F9B7A" opacity="0.18"/>
  <text x="54" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Sudah dibagikan</text>

  <rect x="470" y="324" width="66" height="24" fill="#F4EFE6" stroke="#1F1E28" stroke-opacity="0.2"/>
  <text x="488" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Preview</text>
  <rect x="546" y="324" width="66" height="24" fill="#E8A87C"/>
  <text x="568" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28">Edit</text>
  <rect x="622" y="324" width="54" height="24" fill="#14201A"/>
  <text x="634" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#F7F4EC">Bagikan</text>

  <!-- catatan -->
  <text x="24" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#1F1E28" opacity="0.5">Mockup, bukan screenshot. Warna dan jarak mengikuti token di 05-frontend/ui-conventions.md.</text>
</svg>
